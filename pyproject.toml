[project]
name = "yolo-macro-detect"
version = "1.0.0"
description = "Pipeline de detección de macroinvertebrados acuáticos usando YOLOv8"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Galeano", email = "kevin.galeano@example.com" }]
requires-python = ">=3.10"
keywords = [
    "yolo",
    "object-detection",
    "macroinvertebrates",
    "aquatic",
    "computer-vision",
    "deep-learning",
    "robotics",
    "environmental-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.10.0.84",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
    "roboflow>=1.1.66",
    "supervision>=0.25.1",
    "ultralytics>=8.3.152",
]

[project.urls]
"Bug Reports" = "https://github.com/gsmkev/yolo-macro-detect/issues"
Source = "https://github.com/gsmkev/yolo-macro-detect"

[project.scripts]
yolo-macro-detect = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=7.0",
    "pytest-cov>=2.0",
    "mypy>=0.800",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "utils", "data", "reports"]
