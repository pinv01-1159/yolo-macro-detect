[project]
name = "yolo-macro-detect"
version = "1.0.0"
description = "Pipeline de detección de macroinvertebrados acuáticos como bioindicadores de calidad de agua (YOLO)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Galeano", email = "gsmkev@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "yolo",
    "object-detection",
    "macroinvertebrates",
    "aquatic",
    "computer-vision",
    "deep-learning",
    "robotics",
    "environmental-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2.6",
    "opencv-python-headless>=4.10.0.84",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
    "roboflow>=1.1.66",
    "supervision>=0.25.1",
    "ultralytics>=8.3.152",
]

[project.urls]
"Bug Reports" = "https://github.com/pinv01-1159/yolo-macro-detect/issues"
Source = "https://github.com/pinv01-1159/yolo-macro-detect"

[project.scripts]
yolo-macro-detect = "main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=7.0",
    "pytest-cov>=2.0",
    "mypy>=0.800",
]

[tool.uv]
# ultralytics and supervision both depend on plain "opencv-python" (GUI build,
# needs libGL). We only want opencv-python-headless installed (see the
# opencv-python-headless entry in [project.dependencies]): both packages ship
# files at the same "cv2/" path, so having both installed makes which one
# "wins" dependent on install order — this override voids any transitive
# requirement for "opencv-python" so only the headless build is ever installed.
override-dependencies = ["opencv-python; sys_platform == 'never_match_anything'"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Los notebooks siguen otras convenciones (celdas sueltas, imports al vuelo) y
# no forman parte del paquete; lintearlos solo genera ruido.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^notebooks/"]

# tools/ son guiones de analisis y auditoria, no parte del paquete distribuible
# (ver [tool.hatch.build.targets.wheel]). Se ejecutan a mano y sus salidas se
# versionan en reports/paper/. Los errores que quedan ahi son estrechamiento de
# tipos de numpy y csv (reasignar una variable de str a float tras parsear una
# fila), no defectos: anotarlos no aporta correctitud. El paquete si se verifica
# de forma estricta.
[[tool.mypy.overrides]]
module = "tools.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "utils", "data", "reports"]
# El layout es plano: `main.py` y `config.py` viven en la raiz y no son
# paquetes, asi que `packages` no los levanta. Sin ellos el wheel se instala
# pero el entry point falla al importar `main`, y `models` tampoco carga porque
# hace `from config import config` (auditoria M1).
force-include = { "main.py" = "main.py", "config.py" = "config.py" }
